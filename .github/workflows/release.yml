name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve version and release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if [[ -z "$version" ]]; then
            echo "Directory.Build.props does not contain a version." >&2
            exit 1
          fi

          tag="v$version"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "$tag" ]]; then
            echo "Tag ${{ github.ref_name }} does not match project version $version." >&2
            exit 1
          fi

          should_release=true
          if [[ "${{ github.ref_type }}" != "tag" ]] && gh release view "$tag" >/dev/null 2>&1; then
            should_release=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
            installer_arch: x64
          - rid: win-arm64
            platform: ARM64
            installer_arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/PowerToysRun.PluginManager.Core.Tests -c Release
      - name: Publish manager
        run: dotnet publish src/PowerToysRun.PluginManager.App -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/installer-input/App
      - name: Publish updater
        run: dotnet publish src/PowerToysRun.PluginManager.Updater -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/installer-input/App
      - name: Publish installer bootstrapper
        run: dotnet publish src/PowerToysRun.PluginManager.Bootstrapper -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/installer-input/App
      - name: Build bootstrap plugin
        run: dotnet publish src/PowerToysRun.PluginManager.RunPlugin -c Release -r ${{ matrix.rid }} --self-contained false -p:Platform=${{ matrix.platform }} -o artifacts/installer-input/Bootstrap
      - name: Build setup executable
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup compiler was not found on the runner." }
          & $compiler "/DMyVersion=${{ needs.prepare.outputs.version }}" "/DMyArch=${{ matrix.installer_arch }}" "/DSourceRoot=$((Resolve-Path artifacts/installer-input).Path)" "/DOutputRoot=$((New-Item -ItemType Directory -Force artifacts/installer).FullName)" packaging/PowerToysRun.PluginManager.iss
      - name: Assemble portable archive
        shell: pwsh
        run: |
          Copy-Item packaging/Install.ps1 artifacts/installer-input/Install.ps1
          Copy-Item LICENSE artifacts/installer-input/LICENSE
          Compress-Archive -Path artifacts/installer-input/* -DestinationPath artifacts/PowerToysRun-PluginManager-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/installer/*.exe
            artifacts/PowerToysRun-PluginManager-${{ matrix.rid }}.zip
          retention-days: 3

  publish:
    needs:
      - prepare
      - package
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Extract release notes from changelog
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 == "## [" version "]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no notes for $VERSION." >&2
            exit 1
          fi
      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mapfile -t assets < <(find artifacts/release -maxdepth 1 -type f | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "PowerToys Run Plugin Manager $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "${assets[@]}" --target "${{ github.sha }}" --title "PowerToys Run Plugin Manager $VERSION" --notes-file release-notes.md --latest
          fi
